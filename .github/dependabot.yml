version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # A Kotlin update usually needs a source change, so it gets its own pull request instead of blocking
      # the routine updates. Dependabot assigns a dependency to the most specific matching group and counts
      # an update-types rule as more specific than a pattern, so minor-and-patch has to exclude Kotlin
      # explicitly for this group to receive anything.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      minor-and-patch:
        exclude-patterns:
          - "org.jetbrains.kotlin*"
        update-types:
          - "patch"
          - "minor"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "patch"
          - "minor"
